<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Night Bloom</title>
    <meta name="description" content="A five-minute, hands-first wind-down ritual for Meta Quest." />
    <style>
      :root {
        --bg: #07040d;
        --ink: #f3ecff;
        --quiet: #b9add6;
        --accent: #b48cff;
        --panel: rgba(20, 12, 32, 0.86);
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }
      #stage, #stage canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
      #intro {
        position: fixed; left: 50%; bottom: 6vh; transform: translateX(-50%);
        width: min(560px, calc(100% - 32px)); padding: 24px; border-radius: 16px;
        background: var(--panel); border: 1px solid rgba(180, 140, 255, 0.35); text-align: center;
      }
      h1 { margin: 0 0 4px; font-size: 28px; font-weight: 600; letter-spacing: 0.02em; }
      p { margin: 6px 0; color: var(--quiet); line-height: 1.45; }
      .buttons { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin: 16px 0 8px; }
      button {
        font: inherit; font-size: 16px; padding: 12px 20px; border-radius: 999px; cursor: pointer;
        border: 1px solid var(--accent); background: rgba(180, 140, 255, 0.16); color: var(--ink);
      }
      button.primary { background: var(--accent); color: #12081f; font-weight: 600; }
      button:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
      label { color: var(--quiet); font-size: 14px; }
      body.in-xr #intro, body.previewing #intro { display: none; }
    </style>
    <script type="importmap">
      { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }
    </script>
  </head>
  <body>
    <div id="stage"></div>
    <section id="intro" aria-labelledby="title">
      <h1 id="title">Night Bloom</h1>
      <p>Five quiet minutes before sleep. Set down what's on your mind, breathe with a flower that opens with your hands, and plant one intention for tomorrow.</p>
      <p id="summary"></p>
      <div class="buttons">
        <button id="enter-ar" class="primary" hidden>Enter with passthrough</button>
        <button id="enter-vr" hidden>Enter night sky</button>
        <button id="preview">Preview in browser</button>
      </div>
      <p id="xr-note">Hands only. No controllers needed. Best seated.</p>
      <label><input id="mute" type="checkbox" /> Mute sound</label>
    </section>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
