<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Night Bloom</title>
    <meta name="description" content="A five-minute, hands-first wind-down ritual for Meta Quest." />
    <style>
      :root {
        --bg: #07040d;
        --ink: #f3ecff;
        --quiet: #b9add6;
        --accent: #b48cff;
        --panel: rgba(20, 12, 32, 0.86);
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }
      #stage, #stage canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
      #intro {
        position: fixed; left: 50%; bottom: 6vh; transform: translateX(-50%);
        width: min(560px, calc(100% - 32px)); padding: 24px; border-radius: 16px;
        background: var(--panel); border: 1px solid rgba(180, 140, 255, 0.35); text-align: center;
      }
      h1 { margin: 0 0 4px; font-size: 28px; font-weight: 600; letter-spacing: 0.02em; }
      p { margin: 6px 0; color: var(--quiet); line-height: 1.45; }
      .buttons { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin: 16px 0 8px; }
      button {
        font: inherit; font-size: 16px; padding: 12px 20px; border-radius: 999px; cursor: pointer;
        border: 1px solid var(--accent); background: rgba(180, 140, 255, 0.16); color: var(--ink);
      }
      button.primary { background: var(--accent); color: #12081f; font-weight: 600; }
      button:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
      label { color: var(--quiet); font-size: 14px; }
      body.in-xr #intro, body.previewing #intro { display: none; }
    </style>
    <script type="importmap">
      { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }
    </script>
  </head>
  <body>
    <div id="stage"></div>
    <section id="intro" aria-labelledby="title">
      <h1 id="title">Night Bloom</h1>
      <p>Five quiet minutes before sleep. Set down what's on your mind, breathe with a flower that opens with your hands, and plant one intention for tomorrow.</p>
      <p id="summary"></p>
      <div class="buttons">
        <button id="enter-ar" class="primary" hidden>Enter with passthrough</button>
        <button id="enter-vr" hidden>Enter night sky</button>
        <button id="preview">Preview in browser</button>
      </div>
      <p id="xr-note">Hands only. No controllers needed. Best seated.</p>
      <label><input id="mute" type="checkbox" /> Mute sound</label>
    </section>
    <script type="module">
      // ?emulate loads Meta's WebXR emulator (IWER) so the app can be tried on a desktop browser.
      // Normal visits (and the Quest) skip this and use the real WebXR runtime.
      const params = new URLSearchParams(location.search);
      if (params.has('emulate')) {
        const log = document.createElement('pre');
        log.id = 'emulate-log';
        log.style.cssText = 'position:fixed;top:8px;left:8px;right:8px;margin:0;padding:8px;z-index:99;font:12px/1.4 monospace;color:#ffd6d6;background:rgba(40,0,0,.8);border-radius:8px;white-space:pre-wrap;display:none';
        document.body.append(log);
        const show = (msg) => { log.style.display = 'block'; log.textContent += msg + '\n'; };
        addEventListener('error', (e) => show('Error: ' + (e.message || e)));
        addEventListener('unhandledrejection', (e) => show('Rejected: ' + (e.reason?.stack || e.reason)));
        try {
          const { XRDevice, metaQuest3 } = await import('https://cdn.jsdelivr.net/npm/iwer@2.7.0/build/iwer.module.js');
          const device = new XRDevice(metaQuest3, { stereoEnabled: false });
          device.position.set(0, 1.2, 0); // seated eye height
          device.primaryInputMode = params.get('emulate') === 'controller' ? 'controller' : 'hand';
          device.installRuntime({ forceInstall: true });
          window.__xrDevice = device;
        } catch (err) {
          show('Emulator failed to load: ' + err);
        }
      }
      await import('./src/main.js?v=10');
      // ?emulate&autoplay walks the emulated hand through the whole ritual, for filming the demo.
      if (window.__xrDevice && params.has('autoplay') && window.__nightBloom) {
        const { createAutopilot } = await import('./src/autopilot.js?v=10');
        const device = window.__xrDevice;
        device.fovy = (70 * Math.PI) / 180; // a tighter shot than the headset's wide view, for filming
        const pitch = (-12 * Math.PI) / 180; // look slightly down at the table
        device.quaternion.set(Math.sin(pitch / 2), 0, 0, Math.cos(pitch / 2));
        const note = document.getElementById('xr-note');
        if (note) note.textContent = 'Autoplay is on: press Enter night sky and the hand will do the rest.';
        window.__nightBloomFrame = createAutopilot(window.__xrDevice, window.__nightBloom, (msg) => {
          const el = document.getElementById('emulate-log');
          if (el && msg) { el.style.display = 'block'; el.textContent += msg + '\n'; }
        });
        if (params.has('record')) recordDemo(window.__nightBloom, window.__xrDevice, note);
      }

      // ?record (with ?emulate&autoplay): films the canvas and sound from Enter to the bloom,
      // then saves night-bloom-demo.webm to the Downloads folder.
      function recordDemo(app, device, note) {
        if (note) note.textContent = 'Recording is on: press Enter night sky. The video saves to Downloads when the flower blooms.';
        const badge = document.createElement('div');
        badge.style.cssText = 'position:fixed;top:12px;right:12px;z-index:99;padding:6px 12px;border-radius:999px;font:600 14px system-ui;color:#fff;background:#c0263a;display:none';
        badge.textContent = '● Recording';
        document.body.append(badge);
        let rec = null;
        let bloomAt = null;
        const chunks = [];
        const timer = setInterval(() => {
          if (!rec && app.presenting()) {
            const stream = app.canvas().captureStream(30);
            app.audioStream()?.getAudioTracks().forEach((t) => stream.addTrack(t));
            const type = ['video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm'].find((t) => MediaRecorder.isTypeSupported(t));
            rec = new MediaRecorder(stream, { mimeType: type, videoBitsPerSecond: 8_000_000 });
            rec.ondataavailable = (e) => e.data.size && chunks.push(e.data);
            rec.onstop = () => {
              const a = document.createElement('a');
              a.href = URL.createObjectURL(new Blob(chunks, { type: 'video/webm' }));
              a.download = 'night-bloom-demo.webm';
              document.body.append(a);
              a.click();
              badge.textContent = 'Saved night-bloom-demo.webm';
              badge.style.background = '#2f7d4f';
            };
            rec.start(1000);
            badge.style.display = 'block';
          }
          if (rec?.state === 'recording') {
            if (app.step() === 'bloom' && bloomAt == null) bloomAt = performance.now();
            if (bloomAt != null && performance.now() - bloomAt > 10000) {
              rec.stop();
              clearInterval(timer);
            }
          }
        }, 250);
      }
    </script>
  </body>
</html>
